name: Deploy Web Build to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_TAG: "4.6.2-stable"
      GODOT_TEMPLATE_DIR: "4.6.2.stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot 4.6.2 headless editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-ci
          key: godot-web-${{ runner.os }}-4.6.2-stable

      - name: Download Godot 4.6.2 headless editor and templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/godot-ci/editor ~/.cache/godot-ci/templates
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/.cache/godot-ci/editor
          rm -f /tmp/godot.zip
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d ~/.cache/godot-ci/templates_raw
          mv ~/.cache/godot-ci/templates_raw/templates/* ~/.cache/godot-ci/templates/
          rm -rf /tmp/templates.tpz ~/.cache/godot-ci/templates_raw

      - name: Install export templates and export Web build
        run: |
          GODOT_BIN=$(find ~/.cache/godot-ci/editor -maxdepth 2 -type f -name 'Godot_*' | head -n 1)
          chmod +x "${GODOT_BIN}"
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp -r ~/.cache/godot-ci/templates/. "${HOME}/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"
          mkdir -p build/web
          "${GODOT_BIN}" --headless --path . --import
          "${GODOT_BIN}" --headless --path . --export-release "Web" build/web/index.html
          ls -lh build/web/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
